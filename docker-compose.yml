version: '3.8'

services:
  doorbell-api:
    build: .
    container_name: doorbell_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ESP32_STREAM_URL=http://192.168.68.108/mjpeg
    volumes:
      - ./captures:/code/captures
      - ./known_faces:/code/known_faces
      - ./templates:/code/templates