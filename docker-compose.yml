services:
  doorbell-api:
    build: .
    container_name: doorbell_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ESP32_STREAM_URL: http://192.168.68.108/mjpeg
    volumes:
      - ./captures:/code/captures
      - ./known_faces:/code/known_faces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
